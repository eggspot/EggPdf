name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (.NET ${{ matrix.dotnet-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['9.0.x', '10.0.x']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test tests/EggPdf.Tests.Unit --configuration Release --no-build --verbosity normal

      - name: Layout Tests
        run: dotnet test tests/EggPdf.Tests.Layout --configuration Release --no-build --verbosity normal

      - name: Install Playwright Browsers
        if: matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x'
        run: pwsh tests/EggPdf.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: E2E Tests (Playwright)
        if: matrix.os == 'ubuntu-latest' && matrix.dotnet-version == '10.0.x'
        run: dotnet test tests/EggPdf.Tests.E2E --configuration Release --no-build --verbosity normal
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
