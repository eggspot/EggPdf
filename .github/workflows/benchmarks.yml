name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark-pr:
    name: Benchmark (PR Quick Check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks on the base commit
        working-directory: base/benchmarks/EggPdf.Benchmarks
        run: dotnet run -c Release -- --filter '*' --exporters github
        continue-on-error: true

      - name: Run benchmarks on this PR
        working-directory: head/benchmarks/EggPdf.Benchmarks
        run: dotnet run -c Release -- --filter '*' --exporters github
        continue-on-error: true

      - name: Compare
        id: results
        run: |
          python3 head/scripts/compare-benchmarks.py \
            base/benchmarks/EggPdf.Benchmarks/BenchmarkDotNet.Artifacts/results \
            head/benchmarks/EggPdf.Benchmarks/BenchmarkDotNet.Artifacts/results > comparison.md || exit 0
          {
            echo "report<<EOF"
            cat comparison.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.results.outputs.report != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmarks
          message: |
            ## Benchmark Results

            Base `${{ github.event.pull_request.base.sha }}` and this PR, measured one after the other in the same job, so on the same runner.

            ${{ steps.results.outputs.report }}

            > Full benchmarks run on merge to main.

  benchmark-main:
    name: Benchmark (Full)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks (full)
        run: |
          cd benchmarks/EggPdf.Benchmarks
          dotnet run -c Release -- --filter '*' --exporters fulljson github
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/EggPdf.Benchmarks/BenchmarkDotNet.Artifacts/
          retention-days: 90

      - name: Update README benchmarks
        if: github.event_name == 'push'
        run: |
          if [ -f "scripts/update-readme-benchmarks.py" ]; then
            python3 scripts/update-readme-benchmarks.py
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git diff --staged --quiet || git commit -m "docs: update benchmark results [skip ci]"
            git push origin main || true
          fi
