name: Deploy to Koyeb

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image tag to deploy (e.g. 1.0.0). Defaults to latest.'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve image tag
        id: image
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Install Koyeb CLI
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Deploy / update service
        run: |
          IMAGE="eggspot/eggpdf:${{ steps.image.outputs.tag }}"
          echo "Deploying $IMAGE to Koyeb..."

          # Try to update existing service; create if it doesn't exist yet
          koyeb service update eggpdf-demo/web \
            --docker "$IMAGE" \
            --ports 8080:http \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env ASPNETCORE_URLS=http://+:8080 \
            --env WEBUI_ENABLED=true \
            --min-scale 1 \
            --max-scale 1 \
            --instance-type free \
          || koyeb app create eggpdf-demo && \
             koyeb service create web \
               --app eggpdf-demo \
               --docker "$IMAGE" \
               --ports 8080:http \
               --env ASPNETCORE_ENVIRONMENT=Production \
               --env ASPNETCORE_URLS=http://+:8080 \
               --env WEBUI_ENABLED=true \
               --min-scale 1 \
               --max-scale 1 \
               --instance-type free
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
