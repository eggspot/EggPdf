app = "eggpdf-demo"
primary_region = "sin"  # Singapore — close to Vietnam

[build]
  image = "eggspot/eggpdf:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # never sleep — always-on demo
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  WEBUI_ENABLED = "true"

[[services.tcp_checks]]
  grace_period = "10s"
  interval = "30s"
  restart_limit = 3
  timeout = "5s"
